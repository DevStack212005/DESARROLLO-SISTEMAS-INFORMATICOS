<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Incidente</title>
</head>
<body>
    <header>
        <img src="assets/img/logo.png" alt="Logo del sistema Help Desk" width="120">
        <h1>Sistema Help Desk</h1>
    </header>
    <nav aria-label="Menú principal">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="reportar.html">Reportar Incidente</a></li>
            <li><a href="tickets.html">Tickets</a></li>
        </ul>
    </nav>
    <main>
        <section>
            <h2>Registro de Incidentes</h2>
            <article>
                <h3>Formulario de Reporte</h3>
                <form action="#" method="post">
                    <p>
                        <label for="titulo">Título del incidente:</label><br>
                        <input type="text" id="titulo" name="titulo" required>
                    </p>
                    <p>
                        <label for="categoria">Categoría:</label><br>

                        <select id="categoria" name="categoria" required>
                            <option value="">Seleccione una categoría</option>
                            <option value="red">Red</option>
                            <option value="hardware">Hardware</option>
                            <option value="software">Software</option>
                        </select>
                    </p>
                    <fieldset>
                        <legend>Nivel de Prioridad</legend>
                        <input type="radio" id="alta" name="prioridad" value="alta" required>
                        <label for="alta">Alta</label>
                        <input type="radio" id="media" name="prioridad" value="media">
                        <label for="media">Media</label>
                        <input type="radio" id="baja" name="prioridad" value="baja">
                        <label for="baja">Baja</label>
                    </fieldset>
                    <p>
                        <label for="descripcion">Descripción detallada:</label><br>
                        <textarea id="descripcion" name="descripcion" rows="6" cols="50" required></textarea>
                    </p>
                    <p>
                        <button type="submit">Registrar Incidente</button>
                        <button type="reset">Limpiar Formulario</button>
                    </p>
                </form>
            </article>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Sistema Help Desk</p>
    </footer>
</body>

</html>
